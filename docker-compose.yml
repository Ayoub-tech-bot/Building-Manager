services:
  # ========================================================
  # 1. MySQL 8.4 Database
  # ========================================================
  mysql:
    image: mysql:8.4
    container_name: habita-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppass1234"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - habita-network

  # ========================================================
  # 2. Spring Boot Backend Service
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habita-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/Saas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pass1234
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - habita-network

  # ========================================================
  # 3. React Frontend Service (Nginx)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: habita-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - habita-network

networks:
  habita-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
